<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація у системі</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: #0f172a; /* slate-900 */
            color: #e2e8f0; /* slate-200 */
        }
        .tech-font {
            font-family: 'JetBrains Mono', monospace;
        }
        
        /* Стилізація автозаповнення браузера для темної теми */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px #0f172a inset !important;
            -webkit-text-fill-color: #e2e8f0 !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        /* Кастомна іконка для випадаючого списку */
        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1em;
        }
    </style>
</head>
<body class="min-h-screen relative antialiased flex items-center justify-center p-4 selection:bg-blue-500/30">

    <!-- Фоновий патерн для академічного вигляду -->
    <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
        <div class="absolute top-0 left-0 w-full h-full bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCI+CgkJPGNpcmNsZSBjeD0iMjAiIGN5PSIyMCIgcj0iMSIgZmlsbD0icmdiYSgyNTUsMjU1LDI1NSwwLjA1KSIvPgoJPC9zdmc+')] opacity-50"></div>
    </div>

    <main class="relative z-10 w-full max-w-md">
        <div class="bg-slate-800/60 border border-slate-700/50 backdrop-blur-md rounded-xl shadow-2xl overflow-hidden p-8">
            
            <!-- Заголовок форми -->
            <div class="mb-8 text-center border-b border-slate-700 pb-6">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-lg bg-slate-900 border border-slate-700 mb-4 shadow-inner">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-slate-100 tracking-tight">Авторизація</h1>
                <p class="text-slate-400 text-sm mt-2">Доступ до навчального порталу</p>
            </div>

            <!-- Блок для виведення помилок -->
            <div id="error-box" class="hidden mb-6 p-4 rounded-lg bg-red-950/50 border border-red-900/50 text-red-400 text-sm flex items-start gap-3">
                <svg class="w-5 h-5 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
                <span id="error-message" class="leading-relaxed">Помилка валідації.</span>
            </div>

            <form id="registration-form" class="space-y-5" novalidate>
                
                <!-- Поле: Ім'я -->
                <div>
                    <label for="fullName" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Повне ім'я (ПІБ)</label>
                    <input type="text" id="fullName" name="fullName" required
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-200 placeholder-slate-600 focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 outline-none transition-all"
                        placeholder="Шевченко Тарас Григорович">
                </div>

                <!-- Поле: Email -->
                <div>
                    <label for="email" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Електронна пошта</label>
                    <input type="email" id="email" name="email" required
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-200 placeholder-slate-600 focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 outline-none transition-all tech-font text-sm"
                        placeholder="student@university.edu.ua">
                </div>

                <!-- Поле: Роль (Випадаючий список) -->
                <div>
                    <label for="role" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Рівень доступу (Роль)</label>
                    <select id="role" name="role" required
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-200 focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 outline-none transition-all cursor-pointer">
                        <option value="" disabled selected class="text-slate-500">Оберіть роль у системі...</option>
                        <option value="student">Студент</option>
                        <option value="teacher">Викладач</option>
                        <option value="researcher">Дослідник (Науковий співробітник)</option>
                    </select>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 pt-2">
                    <!-- Поле: Пароль -->
                    <div>
                        <label for="password" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Ключ доступу</label>
                        <input type="password" id="password" name="password" required
                            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-200 placeholder-slate-600 focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 outline-none transition-all tech-font"
                            placeholder="••••••••">
                    </div>

                    <!-- Поле: Підтвердження пароля -->
                    <div>
                        <label for="confirmPassword" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Підтвердження</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required
                            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-200 placeholder-slate-600 focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 outline-none transition-all tech-font"
                            placeholder="••••••••">
                    </div>
                </div>

                <!-- Кнопка відправки -->
                <div class="pt-6">
                    <button type="submit" 
                        class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-3 px-4 rounded-lg transition-colors focus:ring-4 focus:ring-blue-500/30 outline-none flex justify-center items-center gap-2">
                        <span>Ініціалізувати запис</span>
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                        </svg>
                    </button>
                </div>
            </form>
            
            <!-- Блок успішної реєстрації (прихований за замовчуванням) -->
            <div id="success-state" class="hidden text-center py-8">
                <div class="w-16 h-16 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center mx-auto mb-4 border border-emerald-500/30">
                    <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                </div>
                <h3 class="text-xl font-bold text-slate-200 mb-2">Обліковий запис створено</h3>
                <p class="text-slate-400 text-sm">Ваші дані успішно занесені до реєстру. Очікуйте підтвердження адміністратором системи.</p>
            </div>
            
        </div>
        
        <p class="text-center text-slate-600 text-xs mt-6 tech-font">
            PORTAL.SYS.VER // 2026.01.04
        </p>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('registration-form');
            const errorBox = document.getElementById('error-box');
            const errorMessage = document.getElementById('error-message');
            const successState = document.getElementById('success-state');

            // Функція для показу помилки
            const showError = (message) => {
                errorMessage.textContent = message;
                errorBox.classList.remove('hidden');
                
                // Додаємо легку анімацію тремтіння
                form.classList.add('animate-pulse');
                setTimeout(() => form.classList.remove('animate-pulse'), 300);
            };

            // Функція для приховання помилки
            const hideError = () => {
                errorBox.classList.add('hidden');
                errorMessage.textContent = '';
            };

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                hideError();

                // Отримуємо значення полів
                const fullName = document.getElementById('fullName').value.trim();
                const email = document.getElementById('email').value.trim();
                const role = document.getElementById('role').value;
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                // 1. Перевірка на порожні поля (базова)
                if (!fullName || !email || !role || !password || !confirmPassword) {
                    showError('Усі поля є обов\'язковими для заповнення. Будь ласка, перевірте дані.');
                    return;
                }

                // 2. Валідація формату Email (регулярний вираз)
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(email)) {
                    showError('Некоректний формат електронної пошти. Використовуйте стандартний формат.');
                    return;
                }

                // 3. Перевірка довжини пароля (академічна суворість)
                if (password.length < 8) {
                    showError('Ключ доступу занадто короткий. Мінімальна довжина — 8 символів.');
                    return;
                }

                // 4. Перевірка співпадіння паролів
                if (password !== confirmPassword) {
                    showError('Ключі доступу (паролі) не співпадають. Введіть їх повторно.');
                    return;
                }

                // Якщо валідація пройдена успішно:
                // Приховуємо форму і показуємо повідомлення про успіх
                form.classList.add('hidden');
                successState.classList.remove('hidden');
                
                // В реальному додатку тут був би POST запит до сервера (наприклад, fetch('/api/register', {...}))
                console.log('Дані готові до відправки:', { fullName, email, role });
            });
        });
    </script>
</body>
</html>
